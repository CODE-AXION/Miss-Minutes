# Per-user Windows installer for this PC (09·T1). Bundles the frozen engine (mm-engine, `npm run engine`)
# and HandBrakeCLI with its licence files (11b); main finds them under process.resourcesPath.
appId: com.finloge.missminutes # = setAppUserModelId in main; toasts need the shortcut's AUMID to match
productName: Miss Minutes
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!engine/**'
  - '!resources/brand/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,components.json}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Smart search (SS·T18): Windows x64 only. transformers.js's Node build never loads the browser
  # runtime, and a model downloaded during development must never ship (it's fetched on opt-in).
  - '!node_modules/onnxruntime-web/**'
  - '!node_modules/onnxruntime-node/bin/napi-v*/{darwin,linux}/**'
  - '!node_modules/onnxruntime-node/bin/napi-v*/win32/arm64/**'
  - '!node_modules/@huggingface/transformers/.cache/**'
asar: true
# Tray PNGs, the notification mascot and the window icon are read from disk by main
# (resources/ -> app.asar.unpacked/resources). Native .node/.dll files of the search runtime
# (onnxruntime, sharp) can't be loaded from inside the asar either (SS·T18).
asarUnpack:
  - resources/**
  - node_modules/onnxruntime-node/**
  - node_modules/sharp/**
  - node_modules/@img/**
# Executables can't run from inside the asar, so these stay plain folders in resources/.
extraResources:
  - from: engine/dist/mm-engine
    to: engine
  - from: ../tools/handbrake
    to: handbrake
    filter:
      - HandBrakeCLI.exe
      - doc/**
win:
  target: nsis
  icon: resources/icon.ico
  executableName: Miss Minutes
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  runAfterFinish: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  # No spaces: GitHub turns them into dots on upload, and latest.yml (the updater's manifest) names this file (UP·T1).
  artifactName: Miss-Minutes-Setup-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  # Uninstall shortcut, autostart cleanup and the optional delete-library / delete-settings questions.
  include: build/installer.nsh
# Auto-update (UP·T1): electron-updater reads latest.yml from the newest GitHub release. Each release must carry
# the installer, its .blockmap and latest.yml (all three are in dist/ after `npm run dist`).
publish:
  provider: github
  owner: CODE-AXION
  repo: Miss-Minutes
npmRebuild: false
